[pytest]
# Pytest configuration for episodic-memory-pipeline
#
# Test markers:
#   - slow: Tests that require downloading models or take > 5 seconds
#
# Running tests:
#   pytest                          # Run fast tests only (default)
#   pytest -m slow                  # Run slow tests only
#   pytest -m "not slow"            # Run fast tests only (explicit)
#   pytest --run-slow               # Run all tests including slow ones
#
# The slow tests require:
#   - FastEmbed models (downloaded on first run)
#   - Sufficient memory for embedding models
#   - May take longer on first run due to model downloads

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

# Note: slow tests are handled by conftest.py
# Use --run-slow to include slow tests, or -m slow to run only slow tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
